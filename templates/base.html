
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}PDF Tools{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">

        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            <span class="brand-icon">P</span>
            PDF Tools
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'image_to_pdf' %}">
                        Image to PDF
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'watermark_remover' %}">
                        Remove Watermark
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'pdf_to_word' %}">
                        PDF to Word
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>


<main>

    {% if messages %}
    <div class="container mt-4">

        {% for message in messages %}
        <div class="alert alert-danger alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close"
                    data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}

    </div>
    {% endif %}

    {% block content %}
    {% endblock %}

</main>


<footer class="footer mt-5">
    <div class="container text-center">
        <p class="mb-0">
            PDF Tools - Simple PDF Solutions
        </p>
    </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
</script>

<script src="{% static 'js/watermark.js' %}"></script>
<script src="{% static 'js/main.js' %}"></script>

</body>
</html>
